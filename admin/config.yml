# Petakin Toolbox 관리자(Decap CMS) 설정
backend:
  name: git-gateway
  branch: main          # GitHub 저장소 기본 브랜치 이름과 같아야 해요

locale: ko
site_url: /
display_url: /
media_folder: icons     # 업로드한 아이콘이 저장되는 폴더
public_folder: /icons

collections:
  - name: toolbox
    label: 툴
    editor: { preview: false }
    files:
      - name: tools
        label: 툴 목록
        file: data/tools.json
        format: json
        fields:
          - name: tools
            label: 툴
            label_singular: 툴
            widget: list
            collapsed: true
            summary: "{{fields.name}} — {{fields.need}}"
            fields:
              - { name: name, label: 이름, widget: string }
              - name: need
                label: 한줄 니즈 ★
                widget: string
                hint: "이 툴을 만든 이유를 한 문장으로. 사이트에서 이름보다 크게 보여요. 예: 이미지 한 장으로, 1분 안에 메타휴먼 호환 얼굴 모델링을 뽑고 싶다"
              - { name: url, label: 링크, widget: string, hint: "https:// 로 시작하는 주소" }
              - name: category
                label: 카테고리
                widget: relation
                collection: settings
                file: categories
                search_fields: ["categories.*.name"]
                value_field: "categories.*.id"
                display_fields: ["categories.*.name"]
              - { name: description, label: 부가 설명, widget: string, required: false, hint: "선택. 마우스를 올렸을 때 툴팁으로만 보여요." }
              - { name: version, label: 버전, widget: string, required: false, hint: "예: 1.2.0" }
              - { name: icon, label: 아이콘 이미지, widget: image, required: false, hint: "정사각형 PNG·SVG 권장. 비워두면 글자+색상 아이콘이 쓰여요." }
              - { name: glyph, label: 아이콘 글자, widget: string, required: false, hint: "이미지가 없을 때 표시 (1~3자, 이모지 가능)" }
              - name: color
                label: 아이콘 색상
                widget: select
                required: false
                default: blue
                options:
                  - { label: 파랑, value: blue }
                  - { label: 남색, value: indigo }
                  - { label: 보라, value: purple }
                  - { label: 분홍, value: pink }
                  - { label: 빨강, value: red }
                  - { label: 주황, value: orange }
                  - { label: 노랑, value: yellow }
                  - { label: 초록, value: green }
                  - { label: 청록, value: teal }
                  - { label: 회색, value: graphite }
                  - { label: 검정, value: black }
                  - { label: 흰색, value: white }
              - name: favorite
                label: 홈 즐겨찾기 순서
                widget: number
                value_type: int
                min: 0
                max: 5
                default: 0
                hint: "1~5를 넣으면 홈에 그 순서로 큰 아이콘이 표시돼요. 0은 표시 안 함."

  - name: settings
    label: 설정
    editor: { preview: false }
    files:
      - name: categories
        label: 카테고리
        file: data/categories.json
        format: json
        fields:
          - name: categories
            label: 카테고리 (위에서부터 순서대로 표시)
            label_singular: 카테고리
            widget: list
            summary: "{{fields.name}}  ({{fields.id}})"
            fields:
              - name: id
                label: ID
                widget: string
                pattern: ["^[a-z0-9-]+$", "영문 소문자, 숫자, - 만 쓸 수 있어요"]
                hint: "툴과 연결되는 값이라 한 번 정하면 바꾸지 마세요. 예: modeling"
              - { name: name, label: 표시 이름, widget: string }
      - name: site
        label: 사이트 정보
        file: data/site.json
        format: json
        fields:
          - { name: title, label: 사이트 이름, widget: string }
